name: Update Issue Status

on:
  pull_request:
    types: [opened, closed]
  push:
    branches:
      - 'BUG-*'

jobs:
  update-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Extract issue number from branch
        id: extract_issue
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH_NAME="${{ github.head_ref }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          
          # Extract issue number from branch name (e.g., BUG-1 -> 1)
          if [[ $BRANCH_NAME =~ ^BUG-([0-9]+)$ ]]; then
            ISSUE_NUMBER="${BASH_REMATCH[1]}"
            echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
            echo "Found issue number: $ISSUE_NUMBER"
          else
            echo "No issue number found in branch name: $BRANCH_NAME"
            exit 1
          fi

      - name: Add comment to issue
        if: steps.extract_issue.outputs.issue_number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = '${{ steps.extract_issue.outputs.issue_number }}';
            const branchName = '${{ github.head_ref || github.ref_name }}';
            const prUrl = '${{ github.event.pull_request.html_url }}';
            const commitSha = '${{ github.sha }}';
            
            let comment = '';
            
            if ('${{ github.event_name }}' === 'pull_request' && '${{ github.event.action }}' === 'opened') {
              comment = `🔧 **Work in Progress**\n\nA pull request has been opened for this issue:\n- Branch: \`${branchName}\`\n- PR: ${prUrl}\n\nThis issue is now being worked on.`;
            } else if ('${{ github.event_name }}' === 'pull_request' && '${{ github.event.action }}' === 'closed' && '${{ github.event.pull_request.merged }}' === 'true') {
              comment = `✅ **Fixed**\n\nThis issue has been resolved and merged:\n- PR: ${prUrl}\n- Commit: ${commitSha}\n\nThe fix is now in the main branch.`;
            } else if ('${{ github.event_name }}' === 'push') {
              comment = `🚀 **Branch Created**\n\nA branch has been created to fix this issue:\n- Branch: \`${branchName}\`\n- Commit: ${commitSha}\n\nWork on this issue has started.`;
            }
            
            if (comment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment
              });
            }

      - name: Add labels to issue
        if: steps.extract_issue.outputs.issue_number != '' && github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = '${{ steps.extract_issue.outputs.issue_number }}';
            
            // Add "in progress" label if it exists, or create a comment
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['in progress']
              });
            } catch (error) {
              console.log('Label "in progress" may not exist. Skipping label addition.');
            }

      - name: Close issue when PR is merged
        if: steps.extract_issue.outputs.issue_number != '' && github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = '${{ steps.extract_issue.outputs.issue_number }}';
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });
            
            console.log(`Issue #${issueNumber} has been closed.`);
